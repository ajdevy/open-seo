name: AutoGeo upstream candidate compatibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open upstream release candidate pull request to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: autogeo-upstream-candidate-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref_name }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: >-
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'autogeo/upstream/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/autogeo/upstream/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: open_seo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_seo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Verify the dispatched candidate pull request
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ github.ref_name }}
          CANDIDATE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: python3 -I -B scripts/autogeo/validate_candidate_pr.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Run application and restore tests
        run: pnpm test:ci --maxWorkers=4
      - name: Run backup-manifest tests
        run: pnpm test:standalone:backup
      - name: Run selective-restore tests
        run: pnpm test:standalone:client-restore
      - name: Apply SQLite migrations locally
        run: pnpm db:migrate:local
      - name: Apply PostgreSQL migrations locally
        env:
          POSTGRES_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/open_seo_test
        run: pnpm db:migrate:pg
